name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: PHP lint
        shell: bash -l {0}
        run: |
          php --version
          find . -name "*.php" -print0 | xargs --no-run-if-empty --null --max-args=1 php -l

      - name: Helm lint
        shell: bash -l {0}
        run: |
          cd conf/helm
          helm version
          helm dependency build
          helm lint

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Registry login
        if: ${{ vars.IMAGE_REGISTRY != '' }}
        uses: docker/login-action@v4.4.0
        with:
          registry: '${{ vars.IMAGE_REGISTRY }}'
          username: '${{ secrets.IMAGE_REGISTRY_USER }}'
          password: '${{ secrets.IMAGE_REGISTRY_TOKEN }}'

      - name: Docker Build
        if: ${{ vars.IMAGE_REGISTRY != '' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: test
