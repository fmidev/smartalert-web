#
# ServerName
#
ServerName localhost

# Further relax access to the default document root:
<Directory "/smartmet">
    Options FollowSymLinks

    # Disable .htaccess files
    AllowOverride None

    #
    # Controls who can get stuff from this server.
    #
    Require all granted
</Directory>

#
# Set Default Charset
#
AddDefaultCharset UTF-8

#
# EnableMMAP off
#
EnableSendfile on
