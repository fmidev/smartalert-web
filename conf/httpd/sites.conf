# Country routing.
#
# Every country is served at /<country code>/ from one shared application. The
# country's own files -- capmap-config.js, data/ and optional custom icons --
# come from the mounted share under sites/<country code>/, never from the image.
#
# Order matters: mod_alias takes the first matching AliasMatch, so the
# country-specific rules must come before the shared ones.

# /ge -> /ge/ so that the page-relative URLs in the shared index resolve
# under the country prefix instead of the document root.
RedirectMatch 301 "^/([a-z]{2}(?:-[a-z]+)?)$" "/$1/"

# Country-specific, from the mounted share
AliasMatch "^/([a-z]{2}(?:-[a-z]+)?)/data/(.*)$"          "/smartmet/www/smartalert/sites/$1/data/$2"
AliasMatch "^/([a-z]{2}(?:-[a-z]+)?)/capmap-config\.js$"  "/smartmet/www/smartalert/sites/$1/capmap-config.js"
AliasMatch "^/([a-z]{2}(?:-[a-z]+)?)/locations\.js$"      "/smartmet/www/smartalert/sites/$1/locations.js"

# Custom icons go through a handler so that a country only needs to supply the
# icons it actually changes; anything it does not have falls back to the
# shared default set.
AliasMatch "^/([a-z]{2}(?:-[a-z]+)?)/img/custom/(.*)$"    "/smartmet/www/smartalert/siteicon.php"

# Shared application
AliasMatch "^/([a-z]{2}(?:-[a-z]+)?)/(js|css|img|i18n)/(.*)$"          "/smartmet/www/smartalert/$2/$3"
AliasMatch "^/([a-z]{2}(?:-[a-z]+)?)/(list|capfeed|lastUpdated)\.php$" "/smartmet/www/smartalert/$2.php"
AliasMatch "^/([a-z]{2}(?:-[a-z]+)?)/(capatom\.xsl|ethiopian_calendar\.js|cap-logo\.png)$" "/smartmet/www/smartalert/$2"
AliasMatch "^/([a-z]{2}(?:-[a-z]+)?)/$"                               "/smartmet/www/smartalert/site.html"

# The share is reached only through the country prefixes above; refuse the
# direct path so one country's directory cannot be browsed from another's URL.
<LocationMatch "^/sites(/|$)">
    Require all denied
</LocationMatch>
