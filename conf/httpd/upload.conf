# CAP upload: /upload/ is a WebDAV view of the share with the same layout as
# the share itself, so the people who publish warnings can map it as one
# network drive and write each country's output to <country>/data/, just as on
# the share. One account covers every country.
#
# Everything under /upload/ can be read -- the configs are public through the
# site anyway -- but only <country>/data/ can be written: the configs run as
# JavaScript in visitors' browsers.
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so

DavLockDB /tmp/smartalert-davlock

# The Windows WebDAV client asks for folders without the trailing slash and
# does not follow redirects, so /upload and /upload/<dir> must answer as they
# are: no RedirectMatch here, and mod_dir must not add the slash either.
SetEnvIf Request_URI "^/upload(/|$)" redirect-carefully
AliasMatch "^/upload(/.*)?$" "/smartmet/www/smartalert/sites$1"

<LocationMatch "^/upload(/|$)">
    Dav On
    SetHandler None

    AuthType Basic
    AuthName "SmartAlert CAP upload"
    AuthBasicProvider file
    AuthUserFile /etc/smartalert-upload/htpasswd
    Require valid-user
    # Windows probes with OPTIONS before it has credentials; the answer only
    # lists the supported methods.
    <If "%{REQUEST_METHOD} == 'OPTIONS'">
        Require all granted
    </If>

    LimitRequestBody 10485760

    # WebDAV needs PUT, MKCOL, PROPFIND, LOCK, MOVE and DELETE, which the CRS
    # method policy rejects, and CAP files are larger than the 128 KB in-memory
    # body limit; Windows may also send files without a Content-Type, and
    # Explorer looks for Desktop.ini in every folder, which the CRS extension
    # policy would answer with 403 instead of 404. Windows locks every file it
    # writes and sends the lock token in the If and Lock-Token headers, which
    # the CRS header policy rejects. The upload itself is authenticated and is
    # never executed.
    SecRuleRemoveById 911100 920420 920340 920440 920450
    SecRequestBodyAccess Off

    # TLS ends at the OpenShift router, so Apache sees plain http while clients
    # name the target of a MOVE or COPY with https://. mod_dav would refuse that
    # as another server, and Windows renames files with MOVE.
    RequestHeader edit Destination "^https://" "http://"

    # Writes -- including the destination of a MOVE or COPY, which mod_dav
    # checks as a subrequest -- only inside some country's data/ directory,
    # never the directory itself.
    <If "! (%{REQUEST_METHOD} in {'GET', 'HEAD', 'OPTIONS', 'PROPFIND'}) && %{REQUEST_URI} !~ m#^/upload/[a-z]{2}(?:-[a-z]+)?/data/.#">
        Require all denied
    </If>
</LocationMatch>
